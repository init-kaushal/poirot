# poirot configuration — copy to poirot.yaml and edit.
# Every field shown here is optional except that poirot needs *some* way to
# reach a cluster (a resolvable kubeconfig context, or in-cluster credentials).

cluster:
  # Path to a kubeconfig. Leave empty to use in-cluster credentials when running
  # inside a pod, otherwise the standard resolution ($KUBECONFIG, then ~/.kube/config).
  kubeconfig: ""
  # Context to use. Empty = the kubeconfig's current-context.
  context: ""

scope:
  # Namespaces to assess. Empty = every namespace except those in `exclude`.
  namespaces: []
  exclude: [kube-system, kube-node-lease]
  # How far back event/age-based rules look.
  lookback: 24h

# Restrict the run to specific analyzers. Empty = all of them.
# M1 only has "reliability".
focus: []

llm:
  provider: anthropic            # anthropic | openai-compatible | none
  model: claude-sonnet-5         # required unless provider is none
  apiKeyEnv: POIROT_LLM_API_KEY  # env var holding the API key
  baseURL: ""                    # override endpoint (proxies / openai-compatible servers)
  maxToolCallsPerGroup: 8        # tool calls the agent may make per object under investigation
  maxTokensPerGroup: 40000       # token budget per object (>= 1000)
  maxFindingsInvestigated: 15    # how many object groups to investigate
  globalBudget: 5m               # wall-clock ceiling for the whole LLM phase

output:
  # report.json (canonical) and report.md are written here.
  dir: ./poirot-out
  # Which severity makes `poirot run` exit non-zero, for CI/CronJob gating.
  # none | warning | critical
  failOn: critical

connectors:
  # Metrics backend for the slo analyzer (M2). One of:
  #   auto      — discover a Prometheus/VictoriaMetrics/Thanos/Mimir Service and
  #               reach it through the Kubernetes API-server proxy (needs RBAC:
  #               get on services/proxy in the backend's namespace)
  #   http://…  — an explicit URL you can already reach (e.g. a kubectl port-forward)
  #   disabled  — skip metrics entirely; slo analyzer reports as skipped
  promql: { url: auto }
  # opencost / alertmanager / gitops arrive in later milestones (parsed, unused now).
  # opencost:     { url: auto, estimateFallback: true }
  # alertmanager: { url: auto }
  # gitops:       { mode: auto }
